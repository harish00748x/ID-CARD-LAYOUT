<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        .id-card {
            width: 350px;
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-header {
            background-color: #123c69;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .student-photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #123c69;
        }

        .student-details {
            padding: 20px;
            font-size: 14px;
        }

        .student-details p {
            margin-bottom: 12px;
        }

        .card-footer {
            background-color: #123c69;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="id-card">
        <div class="card-header">
            <h5>MOHAMED SATHAK COLLEGE</h5>
            <p class="mb-0">STUDENT IDENTITY CARD</p>
        </div>
        <div class="text-center mt-4">
            <img src="id-card.jpg" class="student-photo" alt="Student Photo">
            <h5 class="mt-3 fw-bold">V.HARISH</h5>
            <p class="text-primary fw-semibold">MCA</p>
        </div>
        <div class="student-details">
            <p><strong>Student ID:</strong> 24MCAM0013</p>
            <p><strong>Department:</strong> Computer Applications</p>
            <p><strong>Course:</strong> MCA</p>
            <p><strong>Date of Birth:</strong> 28-10-2002</p>
            <p><strong>Phone:</strong> 6374599395</p>
            <p><strong>Valid Until:</strong>2024-2026</p>
        </div>
        <div class="card-footer">
            <p>Authorized Signature</p>
        </div>
    </div>
</div>
</body>
</html>
